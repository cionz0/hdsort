# Release builds one CGO_ENABLED=0 archive per target and attaches it to a
# GitHub Release. The tag is the version (-ldflags -X main.version=<tag>).
#
# Trigger (GitHub filter patterns, not regex): a full SemVer tag
# vMAJOR.MINOR.PATCH, or the same tag with -alpha.N, -beta.N, or -rc.N.
# A tag missing a segment, such as v1.2, does not match and does not run.
name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-alpha.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.4"
      - name: Build archives
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -eu
          root="$PWD"
          for spec in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64; do
            goos="${spec%/*}"
            goarch="${spec#*/}"
            name="hdsort_${goos}_${goarch}"
            stage="$(mktemp -d)"
            bin="$name"
            if [ "$goos" = "windows" ]; then
              bin="${name}.exe"
            fi
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build -ldflags "-X main.version=${VERSION}" -o "$stage/$bin" ./cmd/hdsort
            if [ "$goos" = "darwin" ]; then
              app="$stage/hdsort.app/Contents"
              mkdir -p "$app/MacOS" "$app/Resources"
              mv "$stage/$bin" "$app/MacOS/hdsort"
              chmod +x "$app/MacOS/hdsort"
              cp assets/icon/icon.icns "$app/Resources/hdsort.icns"
              sed "s/__VERSION__/${VERSION#v}/g" assets/icon/Info.plist > "$app/Info.plist"
              tar -czf "$root/${name}.tar.gz" -C "$stage" hdsort.app
            elif [ "$goos" = "windows" ]; then
              # The icon is linked from cmd/hdsort/rsrc_windows_amd64.syso.
              (cd "$stage" && zip "$root/${name}.zip" "$bin")
            else
              cp assets/icon/icon.png "$stage/hdsort.png"
              sed "s/^Exec=.*/Exec=${bin}/" assets/icon/hdsort.desktop > "$stage/hdsort.desktop"
              tar -czf "$root/${name}.tar.gz" -C "$stage" "$bin" hdsort.png hdsort.desktop
            fi
            rm -rf "$stage"
          done
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" hdsort_*.tar.gz hdsort_*.zip --title "${{ github.ref_name }}" --generate-notes
